<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Leigh Steinberg Celebrity Charity Poker Tournament</title>
<meta name="description" content="Sponsorship deck. Super Bowl Saturday, February 13, 2027, The Ebell of Los Angeles.">
<style>
  :root{--bg:#0B0A08;--gold:#C9A36A;--gold2:#E2C58F;--ink:#F4EEE3;--muted:#A79E8E}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  header{text-align:center;padding:34px 20px 22px}
  header .kick{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700;line-height:1.6}
  header .time{color:var(--muted);letter-spacing:.34em;margin-top:2px}
  header h1{margin-top:12px;font-size:21px;font-weight:700;letter-spacing:.05em;line-height:1.35}
  header .meta{margin-top:12px;font-size:14px;color:var(--muted);line-height:1.6}
  .dl{display:inline-block;margin-top:20px;padding:13px 26px;border:2px solid var(--gold);
      border-radius:9px;color:var(--gold2);text-decoration:none;font-size:14px;font-weight:700;
      letter-spacing:.14em;text-transform:uppercase}
  .dl:active{background:rgba(201,163,106,.15)}
  main{max-width:1200px;margin:0 auto;padding:10px 14px 60px}
  figure{margin:0 0 14px}
  img{width:100%;height:auto;display:block;border-radius:6px;background:#141210}
  footer{text-align:center;padding:0 20px 46px;font-size:12px;color:var(--muted);line-height:1.7}
  @media(min-width:800px){header h1{font-size:26px}main{padding:16px 24px 70px}figure{margin-bottom:20px}}
</style>
</head>
<body>
<header>
  <div class="kick">2027 Super Bowl Saturday</div>
  <div class="kick time">1 to 6 PM</div>
  <h1>The Leigh Steinberg Celebrity Charity Poker Tournament</h1>
  <div class="meta">Saturday, February 13, 2027<br>The Ebell of Los Angeles</div>
  <a class="dl" id="dl" href="Leigh-Steinberg-Celebrity-Charity-Poker-Tournament-Sponsor-Deck.pdf">Download the PDF</a>
</header>
<main id="deck"></main>
<script>document.getElementById('dl').href+='?v='+(''+Date.now()).slice(0,-6);</script>
<footer>Scroll for the full deck. Tap any page to open it full size.</footer>
<script>
  var V='25-'+Date.now().toString().slice(0,-6);   // cache-buster, bumped each deploy
  var m=document.getElementById('deck');
  for(var i=1;i<=60;i++){
    var n=(i<10?'0':'')+i, f=document.createElement('figure'), a=document.createElement('a'), g=document.createElement('img');
    g.src='slides/'+n+'.jpg?v='+V; g.alt='Page '+i; g.width=1440; g.height=810;
    g.loading = (i<=2 ? 'eager' : 'lazy'); g.decoding='async';
    g.onerror=function(){ if(this.parentNode&&this.parentNode.parentNode) this.parentNode.parentNode.remove(); };
    a.href='slides/'+n+'.jpg?v='+V; a.appendChild(g); f.appendChild(a); m.appendChild(f);
  }
</script>
</body>
</html>
