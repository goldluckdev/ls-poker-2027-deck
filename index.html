<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Leigh Steinberg Celebrity Charity Poker Tournament</title>
<meta name="description" content="Sponsorship deck. Super Bowl Saturday, February 13, 2027, The Ebell of Los Angeles.">
<style>
  :root{--bg:#0B0A08;--gold:#C9A36A;--gold2:#E2C58F;--ink:#F4EEE3;--muted:#A79E8E}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  header{text-align:center;padding:34px 20px 22px}
  header .kick{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700;line-height:1.6}
  header .time{color:var(--muted);letter-spacing:.34em;margin-top:2px}
  header h1{margin-top:12px;font-size:21px;font-weight:700;letter-spacing:.05em;line-height:1.35}
  header .meta{margin-top:12px;font-size:14px;color:var(--muted);line-height:1.6}
  .dl{display:inline-block;margin-top:20px;padding:13px 26px;border:2px solid var(--gold);
      border-radius:9px;color:var(--gold2);text-decoration:none;font-size:14px;font-weight:700;
      letter-spacing:.14em;text-transform:uppercase}
  .dl:active{background:rgba(201,163,106,.15)}
  main{max-width:1200px;margin:0 auto;padding:10px 14px 60px}
  figure{margin:0 0 14px}
  img{width:100%;height:auto;display:block;border-radius:6px;background:#141210}
  footer{text-align:center;padding:0 20px 46px;font-size:12px;color:var(--muted);line-height:1.7}
  @media(min-width:800px){header h1{font-size:26px}main{padding:16px 24px 70px}figure{margin-bottom:20px}}
</style>
</head>
<body>
<header>
  <div class="kick">2027 Super Bowl Saturday</div>
  <div class="kick time">1 to 6 PM</div>
  <h1>The Leigh Steinberg Celebrity Charity Poker Tournament</h1>
  <div class="meta">Saturday, February 13, 2027<br>The Ebell of Los Angeles</div>
  <a class="dl" id="dl" href="Leigh-Steinberg-Celebrity-Charity-Poker-Tournament-Sponsor-Deck.pdf">Download the PDF</a>
</header>
<main id="deck"></main>
<script>document.getElementById('dl').href+='?v='+(''+Date.now()).slice(0,-6);</script>
<footer>Scroll for the full deck. Tap any page to open it full size.</footer>
<script>
  // Progressive probe: figures start HIDDEN and are revealed only once their image
  // actually loads, so a page that does not exist never shows as a blank box.
  // We request only a few ahead of what has loaded, so the deck self-sizes without
  // firing dozens of requests (and dozens of 404s) on first paint.
  var V='26-'+Date.now().toString().slice(0,-6);   // cache-buster, bumped each deploy
  var MAX=80, LOOKAHEAD=4, MIN_PROBE=3;
  var m=document.getElementById('deck');
  var requested=0, missStreak=0, stopped=false;

  function reveal(img){
    var f=img.closest('figure'); if(f) f.style.display='';
    missStreak=0;
    grow();
  }
  function giveUp(i){
    var f=document.getElementById('f'+i); if(f) f.parentNode.removeChild(f);
    missStreak++;
    // two confirmed-missing pages in a row means we have run off the end of the deck
    if(missStreak>=2 && requested>MIN_PROBE){ stopped=true; return; }
    grow();
  }
  function grow(){
    while(!stopped && requested<MAX && requested < highestLoaded()+LOOKAHEAD) add(++requested);
  }
  function highestLoaded(){
    var figs=m.querySelectorAll('figure'); var h=0;
    for(var k=0;k<figs.length;k++) if(figs[k].style.display==='') h=Math.max(h,+figs[k].dataset.i);
    return h;
  }
  function add(i){
    var n=(i<10?'0':'')+i;
    var f=document.createElement('figure'); f.id='f'+i; f.dataset.i=i; f.style.display='none';
    var a=document.createElement('a'), g=document.createElement('img');
    a.href='slides/'+n+'.jpg?v='+V;
    g.alt='Page '+i; g.width=1440; g.height=810; g.decoding='async'; g.dataset.tries='0';
    g.onload=function(){ reveal(this); };
    g.onerror=function(){
      var t=parseInt(this.dataset.tries||'0',10);
      if(t<3){                                  // never treat a blip as a missing page
        this.dataset.tries=String(t+1);
        var self=this, base=this.src.split('?')[0];
        setTimeout(function(){ self.src=base+'?r='+t+'-'+Date.now(); }, 700*(t+1));
        return;
      }
      giveUp(i);
    };
    g.src='slides/'+n+'.jpg?v='+V;
    a.appendChild(g); f.appendChild(a); m.appendChild(f);
  }
  for(var i=0;i<LOOKAHEAD;i++) add(++requested);
</script>
</body>
</html>
